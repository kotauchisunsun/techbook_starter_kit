name: Check PDF rendering

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  visual-regression:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'vrt') &&
      (github.event.action != 'labeled' || github.event.label.name == 'vrt')
    # Keep concurrency inside the eligible job: unrelated labels must not cancel VRT.
    concurrency:
      group: pdf-vrt-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the comparison baseline
        run: |
          baseline=$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")
          git worktree add --detach "$RUNNER_TEMP/baseline" "$baseline"
      - name: Build, render, and compare PDFs in Docker
        run: |
          docker run --rm \
            -e CI=true \
            -v "$GITHUB_WORKSPACE:/work/current" \
            -v "$RUNNER_TEMP/baseline:/work/baseline" \
            -v /work/current/node_modules \
            -v /work/baseline/node_modules \
            -w /work/current node:24-trixie-slim sh -ec '
              sh scripts/setup.sh
              apt-get install -y --no-install-recommends imagemagick
              for dir in /work/baseline /work/current; do
                cd "$dir"
                npm ci
                npx playwright install --with-deps chromium-headless-shell
                npm run build
                npm run build:print
                npm run check:pdf -- output/pdf/book.pdf output/pdf/book_print.pdf
              done
              cd /work/current
              sh scripts/render-pdf-pages.sh /work/baseline/output/pdf output/visual/before
              sh scripts/render-pdf-pages.sh output/pdf output/visual/after
              node scripts/compare-pdf-pages.js output/visual/before output/visual/after output/visual/diff output/visual/report.json
            '
      - name: Record build failure
        if: failure()
        run: |
          mkdir -p output/visual
          if [ ! -f output/visual/report.json ]; then
            printf '%s\n' '{"errors":[{"reason":"PDF の生成またはページ画像への変換に失敗しました。ワークフローのログを確認してください。"}]}' > output/visual/report.json
          fi
      - uses: actions/upload-artifact@v7.0.2
        id: visual
        if: failure()
        with:
          name: pr-${{ github.event.pull_request.number }}-visual-regression
          path: output/visual/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # A separate trusted workflow reports results, including fork/Dependabot PRs.
      - name: Prepare comparison report
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/vrt-report"
          if [ ! -f output/visual/report.json ]; then
            mkdir -p output/visual
            printf '%s\n' '{"errors":[{"reason":"VRT report unavailable; inspect the workflow logs."}]}' > output/visual/report.json
          fi
          cp output/visual/report.json "$RUNNER_TEMP/vrt-report/pr-${PR_NUMBER}-vrt-report.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pr-${{ github.event.pull_request.number }}-vrt-report.json
          path: ${{ runner.temp }}/vrt-report/pr-${{ github.event.pull_request.number }}-vrt-report.json
          archive: false
          if-no-files-found: error
          retention-days: 7
          overwrite: true
