name: Check PDF rendering

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  visual-regression:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'vrt') &&
      (github.event.action != 'labeled' || github.event.label.name == 'vrt')
    # Keep concurrency inside the eligible job: unrelated labels must not cancel VRT.
    concurrency:
      group: pdf-vrt-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the comparison baseline
        run: |
          baseline=$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")
          git worktree add --detach "$RUNNER_TEMP/baseline" "$baseline"
      - name: Build, render, and compare PDFs in Docker
        run: |
          docker run --rm \
            -e CI=true \
            -v "$GITHUB_WORKSPACE:/work/current" \
            -v "$RUNNER_TEMP/baseline:/work/baseline" \
            -v /work/current/node_modules \
            -v /work/baseline/node_modules \
            -w /work/current node:24-trixie-slim sh -ec '
              sh scripts/setup.sh
              apt-get install -y --no-install-recommends imagemagick
              for dir in /work/baseline /work/current; do
                cd "$dir"
                npm ci
                npx playwright install --with-deps chromium-headless-shell
                npm run build
                npm run build:print
                npm run check:pdf -- output/pdf/book.pdf output/pdf/book_print.pdf
              done
              cd /work/current
              sh scripts/pdf/render-pdf-pages.sh /work/baseline/output/pdf output/visual/before
              sh scripts/pdf/render-pdf-pages.sh output/pdf output/visual/after
              node --import tsx scripts/vrt/compare-pdf-pages.ts output/visual/before output/visual/after output/visual/diff output/visual/pdf-report.json
            '
      - name: Build, render, and compare EPUBs in Docker
        if: ${{ !cancelled() }}
        run: |
          docker build -t techbook-epub-vrt - < scripts/vrt/epub-vrt.Dockerfile
          docker run --rm \
            -e CI=true \
            -v "$GITHUB_WORKSPACE:/work/current" \
            -v "$RUNNER_TEMP/baseline:/work/baseline" \
            -v /work/current/node_modules \
            -v /work/baseline/node_modules \
            -w /work/current techbook-epub-vrt sh scripts/vrt/run-epub-vrt.sh
      # Docker installs live in anonymous volumes, not the host checkout.
      - uses: actions/setup-node@v7.1.0
        if: always()
        with:
          node-version: '24'
          cache: npm
      - name: Install host report dependencies
        if: always()
        run: npm ci
      - name: Combine PDF and EPUB results
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Docker outputs can be root-owned; host writes belong in runner temp.
        run: node --import tsx scripts/vrt/combine-vrt-reports.ts output/visual "$RUNNER_TEMP/vrt-report/pr-${PR_NUMBER}-vrt-report.json"
      - uses: actions/upload-artifact@v7.0.2
        id: visual
        if: failure()
        with:
          name: pr-${{ github.event.pull_request.number }}-visual-regression
          path: output/visual/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # A separate trusted workflow reports results, including fork/Dependabot PRs.
      - name: Prepare comparison report
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/vrt-report"
          report="$RUNNER_TEMP/vrt-report/pr-${PR_NUMBER}-vrt-report.json"
          if [ ! -f "$report" ]; then
            printf '%s\n' '{"errors":[{"reason":"VRT report unavailable; inspect the workflow logs."}]}' > "$report"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pr-${{ github.event.pull_request.number }}-vrt-report.json
          path: ${{ runner.temp }}/vrt-report/pr-${{ github.event.pull_request.number }}-vrt-report.json
          archive: false
          if-no-files-found: error
          retention-days: 7
          overwrite: true
