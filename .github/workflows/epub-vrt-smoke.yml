name: Test EPUB visual comparison

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  epub-vrt-smoke:
    if: vars.ENABLE_DEV == 'TRUE'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
          enable-cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          uv sync --locked --only-group vrt
          npm ci
          npx playwright install --with-deps chromium-headless-shell webkit
      - run: node --import tsx --test scripts/vrt/compare-epub-pages.test.ts
      - run: npm run test:vrt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-{0}-epub-vrt-smoke', github.event.pull_request.number) || format('epub-vrt-smoke-{0}', github.run_id) }}
          path: output/epub-vrt-smoke/
          retention-days: 7
          if-no-files-found: error
