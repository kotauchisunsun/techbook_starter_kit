name: Check pull request PDFs

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      built_at: ${{ steps.build.outputs.built_at }}
      lint_report: ${{ steps.lint.outputs.report }}
      artifact_notice: ${{ steps.artifact_notice.outputs.result }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install fonts and PDF tools
        run: sudo sh scripts/setup.sh
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
      - name: Lint manuscripts
        id: lint
        run: |
          if npm run lint > "$RUNNER_TEMP/textlint.log" 2>&1; then
            echo '指摘はありませんでした。' > "$RUNNER_TEMP/textlint.log"
          fi
          cat "$RUNNER_TEMP/textlint.log"
          delimiter="TEXTLINT_RESULT_$(date +%s%N)"
          {
            echo "report<<$delimiter"
            cat "$RUNNER_TEMP/textlint.log"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Build and check PDFs
        id: build
        run: |
          npm run build:all
          npm run check:pdf -- output/pdf/book.pdf output/pdf/book_print.pdf
          echo "built_at=$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S JST')" >> "$GITHUB_OUTPUT"
      # archive:false uses the filename, not the name input. Give each PR
      # its own upload copies; leave build/release source PDFs unchanged.
      - name: Prepare PR-specific PDF filenames
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-artifacts"
          cp output/pdf/book.pdf "$RUNNER_TEMP/pr-artifacts/pr-${PR_NUMBER}-pdf.pdf"
          cp output/pdf/book_print.pdf "$RUNNER_TEMP/pr-artifacts/pr-${PR_NUMBER}-print-pdf.pdf"
      - uses: actions/upload-artifact@v7.0.2
        id: pdf
        with:
          name: pr-${{ github.event.pull_request.number }}-pdf.pdf
          path: ${{ runner.temp }}/pr-artifacts/pr-${{ github.event.pull_request.number }}-pdf.pdf
          archive: false
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        id: print_pdf
        with:
          name: pr-${{ github.event.pull_request.number }}-print-pdf.pdf
          path: ${{ runner.temp }}/pr-artifacts/pr-${{ github.event.pull_request.number }}-print-pdf.pdf
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Read PDF artifact expiry dates
        id: artifact_notice
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PDF_ID: ${{ steps.pdf.outputs.artifact-id }}
          PDF_URL: ${{ steps.pdf.outputs.artifact-url }}
          PRINT_PDF_ID: ${{ steps.print_pdf.outputs.artifact-id }}
          PRINT_PDF_URL: ${{ steps.print_pdf.outputs.artifact-url }}
        with:
          result-encoding: string
          script: |
            const {artifactDownloadLine, runDetails, retentionNote} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-artifact-notice.js`);
            const lines = [];
            for (const [key, suffix, label] of [['PDF', 'pdf.pdf', '通常版 PDF'], ['PRINT_PDF', 'print-pdf.pdf', '印刷用 PDF']]) {
              lines.push(await artifactDownloadLine({github, core, context,
                artifactId: process.env[`${key}_ID`], artifactUrl: process.env[`${key}_URL`],
                expectedName: `pr-${process.env.PR_NUMBER}-${suffix}`, label}));
            }
            return [...lines, '', retentionNote, runDetails({context, env: process.env})].join('\n');

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm run build:docker

  comment:
    needs: build
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ always() }}
        with:
          header: textlint
          message: |
            textlintの結果
            ~~~text
            ${{ needs.build.outputs.lint_report || '実行できませんでした。' }}
            ~~~
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ always() && needs.build.result == 'success' }}
        with:
          header: pdf-build
          message: |
            ビルドしたPDF(${{ needs.build.outputs.built_at }}):
            ${{ needs.build.outputs.artifact_notice }}
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ always() && needs.build.result == 'failure' }}
        with:
          header: pdf-build
          message: ❌pdfのビルドに失敗しました。
