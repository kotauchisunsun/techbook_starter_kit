name: Check pull request PDFs

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      built_at: ${{ steps.build.outputs.built_at }}
      lint_report: ${{ steps.lint.outputs.report }}
      pdf_url: ${{ steps.pdf.outputs.artifact-url }}
      print_pdf_url: ${{ steps.print_pdf.outputs.artifact-url }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install fonts and PDF tools
        run: sudo sh scripts/setup.sh
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
      - name: Lint manuscripts
        id: lint
        run: |
          if npm run lint > "$RUNNER_TEMP/textlint.log" 2>&1; then
            echo '指摘はありませんでした。' > "$RUNNER_TEMP/textlint.log"
          fi
          cat "$RUNNER_TEMP/textlint.log"
          delimiter="TEXTLINT_RESULT_$(date +%s%N)"
          {
            echo "report<<$delimiter"
            cat "$RUNNER_TEMP/textlint.log"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Build and check PDFs
        id: build
        run: |
          npm run build:all
          npm run check:pdf -- output/pdf/book.pdf output/pdf/book_print.pdf
          echo "built_at=$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        id: pdf
        with:
          name: pr-${{ github.event.pull_request.number }}-pdf
          path: output/pdf/book.pdf
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        id: print_pdf
        with:
          name: pr-${{ github.event.pull_request.number }}-print-pdf
          path: output/pdf/book_print.pdf
          archive: false
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm run build:docker

  comment:
    needs: build
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ always() }}
        with:
          header: textlint
          message: |
            textlintの結果
            ~~~text
            ${{ needs.build.outputs.lint_report || '実行できませんでした。' }}
            ~~~
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ always() && needs.build.result == 'success' }}
        with:
          header: pdf-build
          message: |
            ビルドしたPDF(${{ needs.build.outputs.built_at }}):
            - [通常版 PDF](${{ needs.build.outputs.pdf_url }})
            - [印刷用 PDF](${{ needs.build.outputs.print_pdf_url }})
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ always() && needs.build.result == 'failure' }}
        with:
          header: pdf-build
          message: ❌pdfのビルドに失敗しました。
