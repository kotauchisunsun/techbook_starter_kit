name: Build A5 book

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-ipafont fonts-noto-cjk poppler-utils ghostscript
      - name: Build and check PDFs
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
          npm run build
          npm run build:print
          npm run check:pdf -- output/pdf/book.pdf output/pdf/book_print.pdf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: techbook-a5
          path: output/pdf/*.pdf
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: techbook-a5
          path: output/pdf

      - name: Prepare PDFs for release
        id: release
        run: |
          release_date=$(TZ=Asia/Tokyo date +'%Y-%m-%d-%H%M%S')
          echo "tag=$release_date" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp output/pdf/book.pdf "release/techbook_${release_date}.pdf"
          cp output/pdf/book_print.pdf "release/techbook_${release_date}_print.pdf"

      - name: Publish PDFs to Releases
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/techbook_*.pdf
          file_glob: true
          tag: ${{ steps.release.outputs.tag }}
          target_commit: ${{ github.sha }}
