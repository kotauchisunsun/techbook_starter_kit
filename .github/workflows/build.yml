name: Build and publish PDFs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install fonts and PDF tools
        run: sudo sh scripts/setup.sh
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
      - name: Build and check PDFs
        run: |
          npm run build:all
          npm run check:pdf -- output/pdf/book.pdf output/pdf/book_print.pdf
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: techbook-pdf
          path: output/pdf/*.pdf
          if-no-files-found: error
      - name: Prepare PDFs for release
        if: github.ref == 'refs/heads/main'
        id: release
        run: |
          release_date=$(TZ=Asia/Tokyo date +'%Y-%m-%d-%H%M%S')
          echo "tag=$release_date" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp output/pdf/book.pdf "release/techbook_${release_date}.pdf"
          cp output/pdf/book_print.pdf "release/techbook_${release_date}_print.pdf"

      - name: Publish PDFs to Releases
        if: github.ref == 'refs/heads/main'
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/techbook_*.pdf
          file_glob: true
          tag: ${{ steps.release.outputs.tag }}
          target_commit: ${{ github.sha }}
