name: Build and publish PDF and EPUB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: vars.ENABLE_DEV == 'TRUE'
    strategy:
      matrix:
        node: ['22.13.0', '24']
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.4'
          enable-cache: true
      - name: Install source lint tools
        run: uv sync --locked --only-group lint
      - run: npm run typecheck
      - run: npm run lint:code
      - run: npm test
      - run: npm run test:python

  build:
    needs: test
    # A disabled maintenance job must not skip ordinary publication builds.
    # When enabled, its failures (or unexpected skips) still block publication.
    if: ${{ !cancelled() && (needs.test.result == 'success' || (vars.ENABLE_DEV != 'TRUE' && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install fonts and publication tools
        run: sudo sh scripts/setup.sh
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
      - name: Build and check PDF and EPUB
        run: |
          npm run build:all
          npm run check:pdf -- output/pdf/book.pdf output/pdf/book_print.pdf
          npm run check:epub
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: techbook-pdf
          path: output/pdf/*.pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: techbook-epub
          path: output/epub/book.epub
          if-no-files-found: error
      - name: Prepare PDF and EPUB for release
        if: github.ref == 'refs/heads/main'
        id: release
        run: |
          release_date=$(TZ=Asia/Tokyo date +'%Y-%m-%d-%H%M%S')
          echo "tag=$release_date" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp output/pdf/book.pdf "release/techbook_${release_date}.pdf"
          cp output/pdf/book_print.pdf "release/techbook_${release_date}_print.pdf"
          cp output/epub/book.epub "release/techbook_${release_date}.epub"

      - name: Publish PDF and EPUB to Releases
        if: github.ref == 'refs/heads/main'
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/techbook_${{ steps.release.outputs.tag }}*
          file_glob: true
          tag: ${{ steps.release.outputs.tag }}
          target_commit: ${{ github.sha }}
